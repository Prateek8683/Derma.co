<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Access (UI Demo) — Derma.co</title>
  <meta name="description" content="Frontend-only login and sign-up UI demonstration for Derma.co." />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main id="main-content">
    <section class="section">
      <div class="container" style="max-width:520px;">
        <div class="card reveal">
          <div class="text-center">
            <span class="badge badge-coral">Frontend UI Showcase Only</span>
            <h1 class="mt-1" style="font-size:1.85rem;">Welcome to Derma.co</h1>
            <p class="mt-1" style="font-size:0.92rem;">Switch between Login and Sign Up below. No credentials or secrets are stored.</p>
          </div>

          <div class="chip-group mt-2" style="justify-content:center;">
            <button type="button" id="tab-login" class="chip active">Login</button>
            <button type="button" id="tab-signup" class="chip">Create Account</button>
          </div>

          <form id="panel-login" class="mt-3">
            <div class="mb-2">
              <label for="login-email" style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:0.35rem;">Email Address</label>
              <input type="email" id="login-email" class="input" placeholder="you@example.com" required />
            </div>
            <div class="mb-2">
              <label for="login-pass" style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:0.35rem;">Password</label>
              <input type="password" id="login-pass" class="input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Preview Login</button>
          </form>

          <form id="panel-signup" class="mt-3 hidden">
            <div class="mb-2">
              <label for="signup-name" style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:0.35rem;">Full Name</label>
              <input type="text" id="signup-name" class="input" placeholder="Your Name" required />
            </div>
            <div class="mb-2">
              <label for="signup-email" style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:0.35rem;">Email Address</label>
              <input type="email" id="signup-email" class="input" placeholder="you@example.com" required />
            </div>
            <div class="mb-2">
              <label for="signup-pass" style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:0.35rem;">Create Password</label>
              <input type="password" id="signup-pass" class="input" placeholder="At least 8 characters" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Preview Sign Up</button>
          </form>

          <div id="auth-demo-status" class="alert-box hidden" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
