services:
  - type: web
    name: derma-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
